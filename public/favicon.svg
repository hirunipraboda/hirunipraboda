<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
  </defs>
  <!-- Midnight Navy Background with rounded squircle corners -->
  <rect width="64" height="64" rx="14" fill="#0F172A"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left Stem of H -->
  <line x1="16" y1="15" x2="16" y2="49" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- Middle Stem (Shared between H and P) -->
  <line x1="32" y1="15" x2="32" y2="49" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- P Loop -->
  <path d="M 32 15 H 41 C 47.5 15, 47.5 33, 41 33 H 32" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle Electric-Blue Accent Crossbar -->
  <line x1="16" y1="32" x2="32" y2="32" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
</svg>
